<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f0f14;
      color: #e4e4f0;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(135deg, rgba(99,102,241,0.08), transparent);
    }

    .header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px rgba(99,102,241,0.2);
    }

    .header .logo svg { width: 18px; height: 18px; color: white; }

    .header h1 {
      font-size: 16px; font-weight: 700;
      background: linear-gradient(to right, #a5b4fc, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header .status {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .header .status.connected { background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,0.4); }
    .header .status.disconnected { background: #f87171; }

    /* Sections */
    .section { padding: 14px 18px; }

    .section-title {
      font-size: 11px; font-weight: 600; color: rgba(228,228,240,0.35);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
    }

    /* Login Form */
    .login-form { display: flex; flex-direction: column; gap: 10px; }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(15,15,20,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      color: #e4e4f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: rgba(99,102,241,0.5);
    }

    .input-group input::placeholder {
      color: rgba(228,228,240,0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover { background: linear-gradient(135deg, #818cf8, #6366f1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: rgba(228,228,240,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover { color: #f87171; border-color: rgba(248,113,113,0.2); background: rgba(248,113,113,0.05); }

    .error-msg {
      padding: 8px 12px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      color: #f87171;
      font-size: 12px;
    }

    /* User Info */
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(99,102,241,0.06);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .user-avatar {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: 700;
    }

    .user-email {
      font-size: 12px; color: rgba(228,228,240,0.7);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1;
    }

    /* Event/Reminder List */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      transition: background 0.15s;
    }

    .item:hover { background: rgba(255,255,255,0.04); }

    .item .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .item .dot.event { background: #6366f1; }
    .item .dot.reminder { background: #fbbf24; }

    .item .content { flex: 1; min-width: 0; }
    .item .title { font-size: 12px; font-weight: 500; color: #e4e4f0; }
    .item .meta { font-size: 10px; color: rgba(228,228,240,0.3); margin-top: 2px; }

    .empty {
      text-align: center;
      padding: 20px;
      color: rgba(228,228,240,0.2);
      font-size: 12px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <h1>FocusFlow</h1>
    <div class="status disconnected" id="status-dot" title="Not connected"></div>
  </div>

  <!-- Login View -->
  <div id="login-view" class="section">
    <p class="section-title">Sign in to capture events</p>
    <form class="login-form" id="login-form">
      <div class="input-group">
        <input type="email" id="login-email" placeholder="Email" required />
      </div>
      <div class="input-group">
        <input type="password" id="login-password" placeholder="Password" required />
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
    </form>
  </div>

  <!-- Logged-in View -->
  <div id="main-view" class="hidden">
    <div class="section">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-email" id="user-email">loading...</div>
      </div>

      <p class="section-title">Today's Events</p>
      <div id="events-container">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="section" style="padding-top:0">
      <p class="section-title">Reminders</p>
      <div id="reminders-container">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="section" style="padding-top:0">
      <button class="btn-secondary" id="logout-btn">Sign Out</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
